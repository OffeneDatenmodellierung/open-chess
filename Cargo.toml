[workspace]
resolver = "3"
members = [
    "crates/chess-core",
    "crates/chess-analysis",
    "crates/chess-wasm",
    "crates/chess-proto",
    "crates/chess-client",
    "crates/chess-engine",
    "crates/chess-fairplay",
    "crates/chess-server",
    "crates/chess-vision",
    "crates/chess-train",
    "crates/chess-vision-train",
    "crates/chess-conformance",
    "crates/chess-dgt",
    "crates/chess-dgtpi",
    "crates/chess-centaur",
    "crates/chess-ble",
    "crates/chess-chessnut",
    "crates/chess-mobile",
    "crates/chess-device",
    "crates/open-chess",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
repository = "https://github.com/OffeneDatenmodellierung/open-chess"
homepage = "https://github.com/OffeneDatenmodellierung/open-chess"

[workspace.dependencies]
# The workspace's own crates, for each other (published together, one version:
# move `version` here and in [workspace.package] together).
chess-analysis = { package = "open-chess-analysis", path = "crates/chess-analysis", version = "0.1.5" }
chess-ble = { package = "open-chess-ble", path = "crates/chess-ble", version = "0.1.5" }
chess-centaur = { package = "open-chess-centaur", path = "crates/chess-centaur", version = "0.1.5" }
chess-chessnut = { package = "open-chess-chessnut", path = "crates/chess-chessnut", version = "0.1.5" }
chess-client = { package = "open-chess-client", path = "crates/chess-client", version = "0.1.5" }
chess-core = { package = "open-chess-core", path = "crates/chess-core", version = "0.1.5" }
chess-device = { package = "open-chess-device", path = "crates/chess-device", version = "0.1.5" }
chess-dgt = { package = "open-chess-dgt", path = "crates/chess-dgt", version = "0.1.5" }
chess-dgtpi = { package = "open-chess-dgtpi", path = "crates/chess-dgtpi", version = "0.1.5" }
chess-engine = { package = "open-chess-engine", path = "crates/chess-engine", version = "0.1.5" }
chess-fairplay = { package = "open-chess-fairplay", path = "crates/chess-fairplay", version = "0.1.5" }
chess-proto = { package = "open-chess-proto", path = "crates/chess-proto", version = "0.1.5" }
chess-server = { package = "open-chess-server", path = "crates/chess-server", version = "0.1.5" }
chess-train = { package = "open-chess-train", path = "crates/chess-train", version = "0.1.5" }
chess-vision = { package = "open-chess-vision", path = "crates/chess-vision", version = "0.1.5" }
chess-vision-train = { package = "open-chess-vision-train", path = "crates/chess-vision-train", version = "0.1.5" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Container / distribution builds: whole-program LTO (slower to build, a
# little smaller and faster). `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"

# Tests run optimised: the chess search, the endgame tables and the
# networks the tests train are far too slow unoptimised. Debug assertions
# and overflow checks stay on.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2
