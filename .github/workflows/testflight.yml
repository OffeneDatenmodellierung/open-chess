name: TestFlight

# Build the iOS app for the App Store and upload it to App Store Connect,
# where it goes to TestFlight testers and, once submitted, App Review.
#
# Run by hand (Actions › TestFlight › Run workflow) or by pushing a tag
# `ios-v1.0.0` (the version shown in the App Store; the build number is
# this workflow's run number). Needs these repository secrets:
#
#   APPLE_TEAM_ID                  the Apple Developer team id (shared with release.yml)
#   APP_STORE_CONNECT_KEY_ID       an App Store Connect API key's id (role: Admin)
#   APP_STORE_CONNECT_ISSUER_ID    the keys page's issuer id
#   APP_STORE_CONNECT_KEY          the key's .p8 file, its text or base64
#
# These are separate from the macOS release's Developer ID certificate and
# notarising key (APPLE_CERTIFICATE*, APPLE_API_KEY*), which this workflow
# never reads, so the two can't break each other.
#
# Signing is automatic: Xcode makes the certificate and profile in the
# team with the key ("cloud-managed"), so no certificates are kept here.
# Optional: the repository variable (or secret) CHESS_SERVER_URL, the
# server the app starts with (https://…); without it the app asks for one.
# Optional: BOARD_READER_URL, where to download weights to bundle (a
# model card that isn't internal-only; the app refuses those anyway).

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check the secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=""
          for v in TEAM KEY_ID ISSUER KEY; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing (see the top of .github/workflows/testflight.yml)"
            exit 1
          fi
      # Ask App Store Connect directly, before the long build, whether it
      # takes the key: a minute instead of ten when it doesn't, and Apple's
      # own answer instead of xcodebuild's. Prints nothing secret.
      - name: Check the key with App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          BUNDLE_ID: org.offenedatenmodellierung.openchess
        run: |
          python3 -m venv "$RUNNER_TEMP/asc" && "$RUNNER_TEMP/asc/bin/pip" -q install "pyjwt[crypto]==2.10.1"
          "$RUNNER_TEMP/asc/bin/python" scripts/app-store-connect.py check
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ios
          save-if: false
      - name: The core (Metal for the board reader)
        run: METAL=1 scripts/build-xcframework.sh dist/ios
      - name: Board reader weights
        env:
          URL: ${{ secrets.BOARD_READER_URL }}
        run: |
          if [ -n "$URL" ]; then
            mkdir -p ios/Resources && curl -fsSL "$URL" -o ios/Resources/board-reader.safetensors
          else
            echo "::notice::no BOARD_READER_URL: the app ships without the board reader (photos open the board editor)"
          fi
      - name: Version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#ios-v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Archive and export
        env:
          SERVER: ${{ vars.CHESS_SERVER_URL || secrets.CHESS_SERVER_URL }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SERVER" ] || echo "::notice::no CHESS_SERVER_URL variable: the app asks for its server (Account › Server)"
          KEY_ID="$(printf '%s' "$KEY_ID" | tr -d '[:space:]')"
          ISSUER="$(printf '%s' "$ISSUER" | tr -d '[:space:]')"
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          case "$KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$KEY" > "$key" ;;
            *) printf '%s' "$KEY" | base64 --decode > "$key" ;;
          esac
          # On failure: xcodebuild's errors as annotations (on the run's
          # summary page) and the end of its log, then stop.
          fail() {
            log="$RUNNER_TEMP/$1.log"
            grep -E "error:|Error Domain|❌|No profiles|No signing certificate|requires a provisioning profile|doesn't (support|include)|not available|Failed|failed" "$log" \
              | grep -v "^note:" | sort -u | head -30 | while IFS= read -r line; do echo "::error title=xcodebuild $1::$line"; done
            tail -80 "$log"
            rm -f "$key"
            exit 1
          }
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          brew install xcodegen
          cd ios && xcodegen
          xcodebuild -project OpenChess.xcodeproj -scheme OpenChess -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OpenChess.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Development" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES \
            MARKETING_VERSION="${{ steps.v.outputs.version }}" CURRENT_PROJECT_VERSION="${{ steps.v.outputs.build }}" \
            CHESS_SERVER_URL="$SERVER" \
            "${auth[@]}" archive > "$RUNNER_TEMP/archive.log" 2>&1 || fail archive
          tail -40 "$RUNNER_TEMP/archive.log"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OpenChess.xcarchive" \
            -exportOptionsPlist Support/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" > "$RUNNER_TEMP/export.log" 2>&1 || fail export
          tail -40 "$RUNNER_TEMP/export.log"
          rm -f "$key"
          ls -l "$RUNNER_TEMP/export"
      # Upload with App Store Connect's build upload API: xcodebuild's own
      # upload signs in through a service that turned this key down
      # ("Cannot verify client's JWT headers") while the API takes it.
      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          BUNDLE_ID: org.offenedatenmodellierung.openchess
        run: |
          set -euo pipefail
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          "$RUNNER_TEMP/asc/bin/python" scripts/app-store-connect.py upload "$ipa"
