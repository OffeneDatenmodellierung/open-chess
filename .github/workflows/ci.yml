name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * *" # daily: catch new advisories against an unchanged lockfile

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A pinned Rust, so a new release's lints can't fail CI out of the blue.
  # Move it on in its own PR.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu, arm-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked
      # Feature-gated code the workspace build leaves out.
      - run: cargo clippy -p open-chess-dgt --all-targets --features serial --locked
      # The program's builds with one part each.
      - run: cargo clippy -p open-chess --all-targets --no-default-features --features server --locked
      - run: cargo clippy -p open-chess --all-targets --no-default-features --features device --locked
      # Online play brings TLS, whose crypto is partly C: cross compilers.
      - name: C cross compilers for the Pi targets
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      # The device runtime as it builds for a DGT Pi or Centaur: 64-bit
      # Raspberry Pi OS, and 32-bit ARMv6 for the Centaur's original Pi Zero.
      - run: cargo clippy -p open-chess-device -p open-chess-dgtpi -p open-chess-centaur -p open-chess-ble --target aarch64-unknown-linux-gnu --locked
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      - run: cargo clippy -p open-chess-device -p open-chess-centaur --target arm-unknown-linux-gnueabihf --locked
      - run: cargo clippy -p open-chess --no-default-features --features device --target arm-unknown-linux-gnueabihf --locked
        env:
          CC_arm_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          AR_arm_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar

  # The program on macOS and Windows: the board runtime (Bluetooth through
  # btleplug, COM ports on Windows) and the server.
  desktop:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Errors as annotations too, so they show without opening the log.
      - name: cargo clippy
        shell: bash
        run: |
          set +e
          cargo clippy -p open-chess -p open-chess-device -p open-chess-server --all-targets --locked --message-format=short 2>&1 | tee clippy.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then grep -E "(error|warning)" clippy.txt | head -30 | sed 's/^/::error::/'; fi
          exit "$status"
      # The board reader's training on Apple GPUs (the Metal-only code).
      - name: cargo clippy, Metal training
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          cargo clippy -p open-chess-vision-train --features metal --all-targets --locked --message-format=short 2>&1 | tee clippy-metal.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then grep -E "(error|warning)" clippy-metal.txt | head -30 | sed 's/^/::error::/'; fi
          exit "$status"
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test -p open-chess -p open-chess-device --locked 2>&1 | tee test.txt
          status=${PIPESTATUS[0]}
          [ "$status" -ne 0 ] || cargo test -p open-chess-server --lib --locked 2>&1 | tee -a test.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then grep -E "(panicked|FAILED|left:|right:|error)" test.txt | head -30 | sed 's/^/::error::/'; fi
          exit "$status"

  # Everything, the server's end-to-end tests included (two replicas on a
  # real Postgres, fair play with Stockfish).
  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chess
          POSTGRES_PASSWORD: chess
          POSTGRES_DB: chess
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chess" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq stockfish
      # The crates the image builds on their own: a feature only the
      # workspace build turns on would otherwise only show in the image.
      - name: cargo check, image crates alone
        run: |
          cargo check --locked -p open-chess-server
          cargo check --locked -p open-chess --no-default-features --features server
          cargo check --locked -p open-chess-train
      - name: cargo test
        env:
          CHESS_TEST_DATABASE_URL: postgres://chess:chess@127.0.0.1:5432/chess?sslmode=disable
          STOCKFISH: /usr/games/stockfish
        run: cargo test --workspace --locked --no-fail-fast
      # The board transport, on a pseudo-terminal.
      - run: cargo test -p open-chess-dgt --features serial --locked

  # The Chess lab app: the engine and board reader built for wasm and bound
  # with wasm-bindgen, plus the static files, ready to serve.
  app:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: wasm-bindgen CLI matching Cargo.lock
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: scripts/build-chess-app.sh dist/chess && ls -l dist/chess dist/chess/pkg
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: chess-app
          path: dist/chess
          retention-days: 30

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: cargo deny (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  # The image as releases build it, from binaries built first: the server
  # here (on 22.04, so its glibc suits Debian bookworm) and the app from
  # the app job.
  image:
    needs: app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: image
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the server
        run: |
          cargo build --release --locked -p open-chess --no-default-features --features server
          install -D -m 0755 target/release/open-chess dist/linux-amd64/open-chess
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: chess-app
          path: dist/app
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: open-chess:ci
          build-args: BINARIES=local
      - name: Smoke test
        run: |
          docker run --rm open-chess:ci --version
          docker run --rm open-chess:ci analyse --help >/dev/null
          echo quit | docker run --rm -i --entrypoint /usr/games/stockfish open-chess:ci | head -1
          docker run --rm --entrypoint ls open-chess:ci /usr/share/open-chess/app/index.html /usr/share/open-chess/app/pkg
          docker image ls open-chess:ci --format 'image size: {{.Size}}'

  deploy-examples:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate the Kubernetes example
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas deploy/k8s/*.yaml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Type-check the Cloudflare example and validate wrangler.jsonc
        working-directory: deploy/cloudflare
        run: |
          npm ci
          npx tsc --noEmit
          npx wrangler deploy --dry-run --containers-rollout=none --outdir /tmp/wr
