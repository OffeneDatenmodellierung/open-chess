name: Release

# Push a tag `vX.Y.Z` matching [workspace.package] version in Cargo.toml:
#
#   1. binaries: the server (`open-chess`) for Linux x86-64 and arm64; the
#      device runtime (`open-chess-device`) for Linux x86-64, arm64 (64-bit
#      Raspberry Pi OS: the DGT Pi, a Centaur with a Zero 2 W) and ARMv6
#      (the Centaur's original Pi Zero), macOS (Apple silicon and Intel,
#      signed and notarised when the Apple secrets are set) and Windows;
#      and the Chess lab app;
#   2. a GitHub release with them and SHA256SUMS;
#   3. the image, multi-arch, on ghcr.io, from those binaries;
#   4. the crates, on crates.io (when CARGO_REGISTRY_TOKEN is set).
#
# A pull request that changes this workflow, the Dockerfile or the publish
# script builds everything without releasing it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - scripts/publish-crates.py

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          v=$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && $1 == "version" {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$RELEASING" = true ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match Cargo.toml's version $v"
            exit 1
          fi

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binaries run on Debian bookworm
          # and Raspberry Pi OS bookworm too.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, server: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, server: true }
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-22.04, cross: true }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          set -eu
          packages="-p open-chess-device --bin open-chess-device"
          if [ "${{ matrix.server }}" = true ]; then packages="$packages -p open-chess-server --bin open-chess"; fi
          if [ "${{ matrix.cross }}" = true ]; then cargo=cross; else cargo=cargo; fi
          $cargo build --profile dist --locked --target "$TARGET" $packages

      # Signed and notarised when the secrets are set (docs/releases.md).
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          bin="target/$TARGET/dist/open-chess-device"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::no Apple certificate: the macOS binary is unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarise.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --team-id "$APPLE_TEAM_ID" --wait
          else
            echo "::notice::no App Store Connect key: signed but not notarised"
          fi
          security delete-keychain "$keychain"

      - name: Package
        shell: bash
        run: |
          set -eu
          out=dist && mkdir -p "$out"
          pack() { # name, binary
            dir="$1-v$VERSION-$TARGET"
            mkdir -p "$dir"
            cp "target/$TARGET/dist/$2" "$dir/"
            cp LICENSE-MIT LICENSE-APACHE README.md "$dir/"
            if [ "$1" = open-chess-device ]; then
              cp docs/boards.md "$dir/"
              # GPL: the device runtime links the GPL board drivers.
              curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o "$dir/LICENSE-GPL-3.0"
            fi
            if [ "$RUNNER_OS" = Windows ]; then
              7z a -bd "$out/$dir.zip" "$dir" >/dev/null
            else
              tar -czf "$out/$dir.tar.gz" "$dir"
            fi
          }
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          pack open-chess-device "open-chess-device$ext"
          if [ "${{ matrix.server }}" = true ]; then pack open-chess-server open-chess; fi
          ls -l "$out"
      - uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  app:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: wasm-bindgen CLI matching Cargo.lock
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - run: |
          scripts/build-chess-app.sh build/app
          mkdir -p dist
          tar -czf "dist/chess-app-v$VERSION.tar.gz" -C build/app .
      - uses: actions/upload-artifact@v5
        with:
          name: bin-app
          path: dist/*
          retention-days: 7

  release:
    needs: [version, binaries, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "open-chess $VERSION" --generate-notes --verify-tag

  image:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Lay out dist/ for BINARIES=local
        run: |
          set -eu
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "dist/linux-$arch"
            tar -xzf "artifacts/open-chess-server-v$VERSION-$target.tar.gz" --strip-components=1 -C "dist/linux-$arch" "open-chess-server-v$VERSION-$target/open-chess"
          done
          mkdir -p dist/app && tar -xzf "artifacts/chess-app-v$VERSION.tar.gz" -C dist/app
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: env.RELEASING == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: names
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "runtime=$repo:$VERSION,$repo:latest" >> "$GITHUB_OUTPUT"
          echo "slim=$repo:$VERSION-slim,$repo:slim" >> "$GITHUB_OUTPUT"
      - name: The image (runtime, with Stockfish)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARIES=local
          push: ${{ env.RELEASING == 'true' }}
          tags: ${{ steps.names.outputs.runtime }}
      - name: The slim image (API and app only)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          build-args: BINARIES=local
          push: ${{ env.RELEASING == 'true' }}
          tags: ${{ steps.names.outputs.slim }}

  crates:
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Package every crate (what crates.io would get)
        run: cargo package --workspace --locked --no-verify
      - name: Publish (dependencies first; skips versions already there)
        run: |
          if [ "$RELEASING" != true ]; then python3 scripts/publish-crates.py --dry-run; exit 0; fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN isn't set: the crates aren't published"
            python3 scripts/publish-crates.py --dry-run
            exit 0
          fi
          python3 scripts/publish-crates.py
