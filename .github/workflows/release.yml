name: Release

# Push a tag `vX.Y.Z` matching [workspace.package] version in Cargo.toml:
#
#   1. binaries: one program, `open-chess` (the server, the board runtime,
#      the photo reader and its training: Cargo features of the
#      `open-chess` crate), and `open-chess-uci` (the engine alone, for
#      chess GUIs, match runners and training workers), for Linux
#      x86-64 and arm64 (64-bit Raspberry Pi OS too: the DGT Pi, a Centaur
#      with a Zero 2 W), macOS (Apple silicon and Intel, signed and
#      notarised when the Apple secrets are set) and Windows; the board
#      runtime alone for ARMv6 (the Centaur's original Pi Zero); a server
#      alone for Linux (the image); and the Chess lab app;
#   2. a GitHub release with them and SHA256SUMS;
#   3. the image, multi-arch, on ghcr.io, from those binaries;
#   4. the crates, on crates.io (when CARGO_REGISTRY_TOKEN is set).
#
# A pull request that changes this workflow, the Dockerfile or the publish
# script builds everything without releasing it.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - scripts/publish-crates.py

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.0"
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: v
        run: |
          v=$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && $1 == "version" {gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$RELEASING" = true ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match Cargo.toml's version $v"
            exit 1
          fi
          # Every release says what changed (CHANGELOG.md, also the Chess
          # lab's What's new).
          if [ "$RELEASING" = true ] && ! python3 scripts/changelog.py "$v" > /dev/null; then
            echo "::error::CHANGELOG.md has no section for $v: rename its Unreleased heading to '## $v — <date>'"
            exit 1
          fi

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binaries run on Debian bookworm
          # and Raspberry Pi OS bookworm too.
          # `image`: also a server-only build, for the image.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, image: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, image: true }
          # The board runtime alone: the server's crypto and photo reader
          # are dead weight on a Pi Zero (and slow to build for it).
          - { target: arm-unknown-linux-gnueabihf, os: ubuntu-22.04, cross: true, features: device }
          # macOS: the photo reader and its training on the Mac's GPU.
          - { target: aarch64-apple-darwin, os: macos-latest, extra: metal }
          - { target: x86_64-apple-darwin, os: macos-latest, extra: metal }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
          save-if: false
      - if: matrix.cross
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          set -eu
          if [ "${{ matrix.cross }}" = true ]; then cargo=cross; else cargo=cargo; fi
          build() { $cargo build --profile dist --locked --target "$TARGET" -p open-chess "$@"; }
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p out
          # The server alone first (for the image), then the program.
          if [ "${{ matrix.image }}" = true ]; then
            build --no-default-features --features server
            mkdir -p out/server && cp "target/$TARGET/dist/open-chess" out/server/
          fi
          features="${{ matrix.features }}" extra="${{ matrix.extra }}"
          if [ -n "$features" ]; then build --no-default-features --features "$features"
          elif [ -n "$extra" ]; then build --features "$extra"
          else build; fi
          cp "target/$TARGET/dist/open-chess$ext" out/
          # The engine alone, for chess GUIs, match runners and training workers.
          $cargo build --profile dist --locked --target "$TARGET" -p open-chess-uci
          cp "target/$TARGET/dist/open-chess-uci$ext" out/

      # Signed and notarised when the secrets are set (docs/releases.md).
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          bin="out/open-chess"
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::no Apple certificate: the macOS binary is unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          codesign --force --options runtime --timestamp --sign "$identity" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            ditto -c -k --keepParent "$bin" "$RUNNER_TEMP/notarise.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --team-id "$APPLE_TEAM_ID" --wait
          else
            echo "::notice::no App Store Connect key: signed but not notarised"
          fi
          security delete-keychain "$keychain"

      - name: Package
        shell: bash
        run: |
          set -eu
          dist=dist && mkdir -p "$dist"
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=.exe
          pack() { # archive name, binary, gpl (true when the board runtime is in it)
            dir="$1-v$VERSION-$TARGET"
            mkdir -p "$dir"
            cp "$2" "$dir/"
            cp LICENSE-MIT LICENSE-APACHE README.md "$dir/"
            if [ "$3" = true ]; then
              cp docs/boards.md "$dir/"
              # GPL: the board runtime links the GPL board drivers.
              curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o "$dir/LICENSE-GPL-3.0"
              # Run as open-chess-device it's the board runtime straight
              # away (what the systemd units and older installs run).
              [ "$RUNNER_OS" = Windows ] || ln -s open-chess "$dir/open-chess-device"
            fi
            if [ "$RUNNER_OS" = Windows ]; then
              7z a -bd "$dist/$dir.zip" "$dir" >/dev/null
            else
              tar -czf "$dist/$dir.tar.gz" "$dir"
            fi
          }
          pack open-chess "out/open-chess$ext" true
          pack open-chess-uci "out/open-chess-uci$ext" false
          if [ "${{ matrix.image }}" = true ]; then pack open-chess-server out/server/open-chess false; fi
          ls -l "$dist"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  app:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: wasm-bindgen CLI matching Cargo.lock
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/,""); print; exit}' Cargo.lock)
          echo "WASM_BINDGEN_VERSION=$v" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      # The board reader the app (and the server's image, which serves the
      # app) ships: the repository variable BOARD_READER_URL, checked
      # against BOARD_READER_SHA256 when that's set. Without it the app
      # ships without one and photos open the board editor.
      # build-chess-app.sh refuses an internal-only model.
      - name: Board reader weights
        env:
          URL: ${{ vars.BOARD_READER_URL || secrets.BOARD_READER_URL }}
          SHA256: ${{ vars.BOARD_READER_SHA256 }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::no BOARD_READER_URL: the app ships without the board reader"
            exit 0
          fi
          mkdir -p web/chess/nets
          curl -fsSL "$URL" -o web/chess/nets/board-reader.safetensors
          if [ -n "$SHA256" ]; then
            echo "$SHA256  web/chess/nets/board-reader.safetensors" | sha256sum -c -
          fi
          ls -l web/chess/nets/board-reader.safetensors
      - run: |
          scripts/build-chess-app.sh build/app
          mkdir -p dist
          tar -czf "dist/chess-app-v$VERSION.tar.gz" -C build/app .
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: bin-app
          path: dist/*
          retention-days: 7

  release:
    needs: [version, binaries, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
      # The changelog's section first, then GitHub's list of pull requests.
      - run: python3 src/scripts/changelog.py "$VERSION" > notes.md
      - if: env.RELEASING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "open-chess $VERSION" --notes-file notes.md --generate-notes --verify-tag

  image:
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: bin-*
          path: artifacts
          merge-multiple: true
      - name: Lay out dist/ for BINARIES=local
        run: |
          set -eu
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}
            mkdir -p "dist/linux-$arch"
            tar -xzf "artifacts/open-chess-server-v$VERSION-$target.tar.gz" --strip-components=1 -C "dist/linux-$arch" "open-chess-server-v$VERSION-$target/open-chess"
          done
          mkdir -p dist/app && tar -xzf "artifacts/chess-app-v$VERSION.tar.gz" -C dist/app
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: env.RELEASING == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image names
        id: names
        run: |
          repo=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "runtime=$repo:$VERSION,$repo:latest" >> "$GITHUB_OUTPUT"
          echo "slim=$repo:$VERSION-slim,$repo:slim" >> "$GITHUB_OUTPUT"
      - name: The image (runtime, with Stockfish)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: BINARIES=local
          push: ${{ env.RELEASING == 'true' }}
          tags: ${{ steps.names.outputs.runtime }}
      - name: The slim image (API and app only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: slim
          platforms: linux/amd64,linux/arm64
          build-args: BINARIES=local
          push: ${{ env.RELEASING == 'true' }}
          tags: ${{ steps.names.outputs.slim }}

  crates:
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Package every crate (what crates.io would get)
        run: cargo package --workspace --locked --no-verify
      - name: Publish (dependencies first; skips versions already there)
        run: |
          if [ "$RELEASING" != true ]; then python3 scripts/publish-crates.py --dry-run; exit 0; fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN isn't set: the crates aren't published"
            python3 scripts/publish-crates.py --dry-run
            exit 0
          fi
          python3 scripts/publish-crates.py
