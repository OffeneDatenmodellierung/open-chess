[package]
name = "open-chess-train"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Distributed training for the open-chess engine: SPRT tests, SPSA tuning and self-play data, with results from many machines merged deterministically"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
publish = false

[dependencies]
chess-core = { package = "open-chess-core", path = "../chess-core" }
chess-analysis = { package = "open-chess-analysis", path = "../chess-analysis" }
cozy-chess = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
