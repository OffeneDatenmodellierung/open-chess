[package]
name = "open-chess-dgt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The DGT electronic chessboard protocol (USB, serial and Bluetooth boards, the DGT3000 clock on the board's cable) without I/O, and turning board readings into moves"
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# Serial, USB and Bluetooth (RFCOMM) boards on Unix (Linux, macOS).
serial = ["dep:rustix"]

[dependencies]
chess-core = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["fs", "termios"], optional = true }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "termios", "pty"] }

[[example]]
name = "watch"
required-features = ["serial"]

[[test]]
name = "serial_pty"
required-features = ["serial"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
struct_excessive_bools = "allow"
missing_panics_doc = "allow"
match_same_arms = "allow"
