[package]
name = "open-chess-fairplay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Post-game fair-play screening: engine accuracy, engine-match rate, move-time patterns and the training-app fingerprint, for human review"
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chess-core = { workspace = true }
chess-analysis = { workspace = true }
chess-engine = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
