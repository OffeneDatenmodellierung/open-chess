[package]
name = "open-chess-fairplay"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Post-game fair-play screening: engine accuracy, engine-match rate, move-time patterns and the training-app fingerprint, for human review"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
publish = false

[dependencies]
chess-core = { package = "open-chess-core", path = "../chess-core" }
chess-analysis = { package = "open-chess-analysis", path = "../chess-analysis" }
chess-engine = { package = "open-chess-engine", path = "../chess-engine" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
