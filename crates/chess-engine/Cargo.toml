[package]
name = "open-chess-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Async UCI engine driver (Stockfish and friends) for fair-play analysis and bots"
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
tokio = { version = "1.53.2", features = ["process", "io-util", "time", "sync"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
