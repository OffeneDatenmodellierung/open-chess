[package]
name = "open-chess-ble"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A small Bluetooth LE GATT client for chess boards: ATT over the kernel's L2CAP sockets, no D-Bus or system libraries"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["net", "event", "fs"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
