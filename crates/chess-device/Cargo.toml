[package]
name = "open-chess-device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Play chess on an electronic board (DGT USB/Bluetooth/serial boards, DGT Pi, Centaur, Pegasus, Chessnut Air/Go): against an engine, online on Lichess, or as the board for Lichess's DGT page; PicoChess-compatible"
license = "GPL-3.0-or-later"
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "open-chess-device"
path = "src/main.rs"

[dependencies]
chess-core = { workspace = true }
chess-analysis = { workspace = true }
chess-engine = { workspace = true }
chess-dgt = { workspace = true }
chess-ble = { workspace = true }
chess-chessnut = { workspace = true }
chess-client = { workspace = true }
chess-centaur = { workspace = true }
chess-dgtpi = { workspace = true }
chess-proto = { workspace = true }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "process", "io-util", "time", "sync", "net", "fs", "macros"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "net", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["event"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
btleplug = "0.13.5"
hidapi = "2.6.7"

[target.'cfg(windows)'.dependencies]
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(unix)'.dependencies]
chess-dgt = { workspace = true, features = ["serial"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
