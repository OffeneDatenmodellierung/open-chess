[package]
name = "open-chess-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Async client for the Lichess Board, Bot and Challenge APIs; works against lichess.org or an open-chess server"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
publish = false

[dependencies]
chess-proto = { package = "open-chess-proto", path = "../chess-proto" }
bytes = "1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", features = ["json", "query", "form", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
urlencoding = "2.1.3"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
