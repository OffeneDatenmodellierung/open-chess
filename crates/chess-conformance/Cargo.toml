[package]
name = "open-chess-conformance"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Checks the open-chess server's JSON against Lichess's own OpenAPI spec, by driving a running server through a full game"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
publish = false

[[bin]]
name = "chess-conformance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
jsonschema = { version = "0.58.6", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json", "form", "stream"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-postgres = "0.7.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
