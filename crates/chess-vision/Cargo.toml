[package]
name = "open-chess-vision"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Reads a chess position from a photo of a real board: a DINOv2 encoder with 64 square queries, run on CPU with candle on the server and in the browser (wasm) for the offline chess app. Clean-room implementation; ships no weights"
license = "MIT OR Apache-2.0"
authors = ["Mark Olliver"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Decode JPEG/PNG bytes (the server). The browser decodes with a canvas
# and passes RGBA pixels instead.
decode = ["dep:image"]
# wasm-bindgen exports for the PWA's vision worker.
wasm = ["dep:wasm-bindgen", "dep:getrandom"]
# GPUs on the server: NVIDIA (needs the CUDA toolkit to build) and Apple.
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-metal-kernels"]

[dependencies]
chess-analysis = { package = "open-chess-analysis", path = "../chess-analysis" }
chess-core = { package = "open-chess-core", path = "../chess-core" }
cozy-chess = "0.3.4"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
# The fused softmax's Metal kernel (for training: see src/softmax.rs).
candle-metal-kernels = { version = "0.11.0", optional = true }
safetensors = "0.8.0"
half = "2.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
# candle pulls in rand 0.9, whose entropy source (getrandom 0.3, not the
# newest) needs its JS backend on wasm32. Build for wasm with
# RUSTFLAGS='--cfg getrandom_backend="wasm_js"' (the CI job does).
getrandom = { version = "0.3.4", features = ["wasm_js"], optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
similar_names = "allow"
many_single_char_names = "allow"
needless_pass_by_value = "allow"

[[example]]
name = "read_photo"
required-features = ["decode"]
