[package]
name = "open-chess-vision-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Trains the open-chess board reader (chess-vision) with candle: DINOv2 encoder, square queries, licence-gated datasets (ChessReD and our own confirmed photos), on the CPU, CUDA or Metal"
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[[bin]]
name = "chess-vision-train"
path = "src/main.rs"

[features]
cuda = ["chess-vision/cuda"]
metal = ["chess-vision/metal"]

[dependencies]
chess-vision = { workspace = true, features = ["decode"] }
chess-analysis = { workspace = true }
anyhow = "1.0.104"
candle-core = { version = "0.11.0", default-features = false }
candle-nn = { version = "0.11.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
doc_markdown = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
