# Datasets the board reader may be trained on. `chess-vision-train` refuses
# any entry whose licence doesn't allow commercial use of the weights, or
# that nobody has verified at the source (src/licences.rs). Noncommercial
# data (CC BY-NC, BY-NC-SA) is allowed only with `--internal`: the model is
# stamped internal-only and the Chess lab app build refuses to ship it.
#
# To use a dataset: read its licence where it's published, then fill in
# `licence` (SPDX), `licence_url`, `licence_verified = true`, `verified_by`,
# `verified_on`, and for CC BY the `attribution` line the model card will
# carry.
#
# Not here, on purpose: the ChessQueries weights and code (PolyForm
# Noncommercial 1.0.0) and the SLCC broadcast annotations (CC BY-NC 4.0).
# The gate refuses them by name too.

[dataset.chessred]
# Masouris & van Gemert, 10,800 smartphone photos of 100 games, game-level
# 60/20/20 split. https://doi.org/10.4121/99b5c721-280b-450b-b058-b2900b69a90f
# Published as CC BY-NC-SA 4.0. Its author and rights holder, Athanasios
# Masouris, granted us commercial use on 2026-10-14, on condition that the
# dataset and the paper are credited (docs/dataset-permissions.md): the
# attribution line below goes in every model card, and wherever such a model
# ships the credits name both.
licence = "LicenseRef-chessred-permission-2026-10-14"
licence_url = "https://github.com/OffeneDatenmodellierung/open-chess/blob/main/docs/dataset-permissions.md#chessred"
licence_verified = true
verified_by = "Mark Olliver"
verified_on = "2026-10-14"
attribution = "Chess Recognition Dataset (ChessReD), A. Masouris, 4TU.ResearchData, doi:10.4121/99b5c721-280b-450b-b058-b2900b69a90f; A. Masouris and J. van Gemert, End-to-End Chess Recognition, VISAPP 2024 (arXiv:2310.04086). Used with the author's permission."
format = "chessred"
path = "chessred"

[dataset.open-chess-photos]
# Board photos an open-chess server kept for review and people labelled
# (`open-chess photos export --out /data/chess/open-chess-photos`), sent
# under the open-chess photo licence (docs/photo-licence.md): any model,
# commercial or not. Labels two people agreed on, or an admin gave, are the
# reviewed ones (`--reviewed-only`).
licence = "LicenseRef-open-chess-photo-licence-1"
licence_url = "https://github.com/OffeneDatenmodellierung/open-chess/blob/main/docs/photo-licence.md"
licence_verified = true
verified_by = "open-chess"
verified_on = "2026-10-14"
format = "jsonl"
path = "open-chess-photos"

[dataset.open-chess-public]
# The public subset: photos their senders also released as CC0
# (`open-chess photos export --public-only --out /data/chess/open-chess-public`).
licence = "CC0-1.0"
licence_url = "https://creativecommons.org/publicdomain/zero/1.0/legalcode"
licence_verified = true
verified_by = "open-chess"
verified_on = "2026-10-14"
format = "jsonl"
path = "open-chess-public"

# Openly licensed sets from elsewhere, imported with chess-board-renderer's
# import_datasets.py (github.com/OffeneDatenmodellierung/chess-board-renderer,
# DATASETS.md). Each keeps its own licence and attribution.

[dataset.samryan18]
# 500 real photos from above, FEN in each file name.
# github.com/samryan18/chess-dataset (LICENSE.md: MIT).
licence = "MIT"
licence_url = "https://github.com/samryan18/chess-dataset/blob/master/LICENSE.md"
licence_verified = true
verified_by = "Claude for Mark Olliver (LICENSE.md in the repo)"
verified_on = "2026-10-14"
attribution = "Chess Board Dataset, (c) 2019 Samuel Ryan, Mukund Venkateswaran, Kurt Convey, Michael Deng, github.com/samryan18/chess-dataset, MIT"
format = "jsonl"
path = "samryan18"

[dataset.chesscog]
# About 5,000 3D renders with FEN labels (Wolflein & Arandjelovic).
licence = "CC-BY-4.0"
licence_url = "https://osf.io/xf3ka"
licence_verified = true
verified_by = "Mark Olliver"
verified_on = "2026-10-14"
attribution = "Chess recognition rendered dataset, G. Wölflein and O. Arandjelović, OSF, doi:10.17605/OSF.IO/XF3KA, CC BY 4.0"
format = "jsonl"
path = "chesscog"

[dataset.felix-boards]
# 371 real boards, straightened top-down, with board_fen (subset "boards").
# Read the licence on the dataset page, then set licence_verified = true.
licence = "CC-BY-4.0"
licence_url = "https://huggingface.co/datasets/felixfabricius/robot-chess-commentator-squares"
licence_verified = false
verified_by = ""
verified_on = ""
attribution = "robot-chess-commentator-squares (boards), Felix Fabricius, Hugging Face, CC BY 4.0"
format = "jsonl"
path = "felix-boards"

[dataset.fenit-photos]
# Real photos (piece boxes and board corners, not yet turned into FEN):
# unlabelled, for a teacher (--teacher) to read.
licence = "CC-BY-4.0"
licence_url = "https://data.mendeley.com/datasets/wpp9xnbcp6"
licence_verified = true
verified_by = "Mark Olliver"
verified_on = "2026-10-14"
attribution = "Annotated Image Dataset for Fenit, Binus University, Mendeley Data, doi:10.17632/wpp9xnbcp6.1, CC BY 4.0"
format = "photos"
path = "fenit-photos"

[dataset.roboflow-chess-pieces]
# About 290 real photos from one fixed angle (piece boxes only): unlabelled,
# for a teacher to read. Read the licence on the page (it said Public Domain,
# CC0), then set licence_verified = true.
licence = "CC0-1.0"
licence_url = "https://universe.roboflow.com/joseph-nelson/chess-pieces-new"
licence_verified = false
verified_by = ""
verified_on = ""
format = "photos"
path = "roboflow-chess-pieces"

[dataset.synthetic]
# Rendered with chess-board-renderer: models, scenes and positions all our
# own (random games, or Lichess's CC0 database).
licence = "LicenseRef-esl-internal"
licence_verified = true
verified_by = "Mark Olliver"
verified_on = "2026-10-14"
format = "jsonl"
path = "synthetic"
