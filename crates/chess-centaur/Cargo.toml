[package]
name = "open-chess-centaur"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The DGT Centaur's board controller (serial protocol, LEDs, buttons) and following a game from occupancy alone"
license = "GPL-3.0-or-later"
authors = ["Mark Olliver"]
publish = false

[dependencies]
chess-core = { package = "open-chess-core", path = "../chess-core" }
chess-dgt = { package = "open-chess-dgt", path = "../chess-dgt" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
