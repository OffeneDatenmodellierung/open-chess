[package]
name = "open-chess-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A Lichess-compatible chess server: the Board, Bot, Challenge and OAuth APIs on Postgres, with post-game fair-play screening"
license = "MIT OR Apache-2.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
chess-core = { workspace = true }
chess-proto = { workspace = true }
chess-engine = { workspace = true }
chess-fairplay = { workspace = true }
chess-analysis = { workspace = true }
chess-vision = { workspace = true, features = ["decode"] }
cozy-chess = "0.3.4"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool = { version = "0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
argon2 = "0.6.0"
aws-lc-rs = "1.18.1"
ciborium = "0.2.2"
hex = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pem", "std"] }
prometheus = { version = "0.14.0", default-features = false }
reqwest = { version = "0.13.5", features = ["json", "query", "form"] }
rand = "0.10.3"
rustls = "0.23.46"
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "signal", "net", "process", "io-util", "fs"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
tower-http = { version = "0.6.11", features = ["compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
chess-client = { workspace = true }
reqwest = { version = "0.13.5", features = ["json", "form", "stream"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"
implicit_hasher = "allow"
missing_panics_doc = "allow"
