[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: a compile-time macro crate, finished rather than abandoned, with
    # no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build time only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",              # borrow-or-share (jsonschema, the conformance check): MIT without attribution
]
confidence-threshold = 0.9

# The DGT Pi's clock driver (a port of DGT's GPL dgtpicom) and the
# Centaur's controller (from GPL DGTCentaurMods). Only
# these of our own crates; nothing else may depend on them.
[[licenses.exceptions]]
crate = "open-chess-dgtpi"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "open-chess-centaur"
allow = ["GPL-3.0-or-later"]

# Windows COM ports for the device runtime (GPL), file-level copyleft.
[[licenses.exceptions]]
crate = "serialport"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "open-chess-device"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # the workspace's own crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
