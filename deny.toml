[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: a compile-time macro crate, finished rather than abandoned, with
    # no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build time only" },
    # zip: its maintainers yanked every release before 9.0.3 (October 2026),
    # and candle-core 0.11 (the board reader) needs ^8.6. Candle uses it
    # only for .npz and PyTorch .pth files: the app and server load
    # safetensors; only the trainer reads a .pth, one we choose. Drop this
    # once candle takes zip 9.
    { crate = "zip@8.6.0", reason = "yanked upstream; candle-core 0.11 needs ^8.6; only .npz/.pth reading, not on untrusted input" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",              # borrow-or-share (jsonschema, the conformance check): MIT without attribution
]
confidence-threshold = 0.9

# The DGT Pi's clock driver (a port of DGT's GPL dgtpicom) and the
# Centaur's controller (from GPL DGTCentaurMods). Only
# these of our own crates; nothing else may depend on them.
[[licenses.exceptions]]
crate = "open-chess-dgtpi"
allow = ["GPL-3.0-or-later"]

[[licenses.exceptions]]
crate = "open-chess-centaur"
allow = ["GPL-3.0-or-later"]

# UniFFI, the Swift bindings for the iOS app's core: MPL-2.0, file-level
# copyleft (we don't change its files), which the App Store allows. The
# bindgen and UDL crates come with chess-mobile's `bindgen` feature, the
# program that writes the bindings at build time.
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

# Windows COM ports for the device runtime (GPL), file-level copyleft.
[[licenses.exceptions]]
crate = "serialport"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "open-chess-device"
allow = ["GPL-3.0-or-later"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # the workspace's own crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
