[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste: a compile-time macro crate, finished rather than abandoned, with
    # no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc-macro, build time only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # the workspace's own crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
